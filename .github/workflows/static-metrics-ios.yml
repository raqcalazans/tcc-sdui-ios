name: iOS static code metrics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * 1'

permissions:
  contents: read

jobs:
  metrics:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned analyzer
        run: python -m pip install lizard==1.17.31

      - name: Collect Swift source metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metrics
          swift_files=()
          while IFS= read -r file; do
            swift_files+=("$file")
          done < <(find . -type f -name '*.swift' \
            -not -path '*/AmantesDoFutebolTests/*' \
            -not -path '*/AmantesDoFutebolUITests/*' \
            -not -path '*/Pods/*' \
            -not -path '*/DerivedData/*' \
            -not -path '*/.build/*' | sort)
          if [[ ${#swift_files[@]} -eq 0 ]]; then
            echo 'No production Swift files found.' >&2
            exit 1
          fi
          lizard --language swift --csv "${swift_files[@]}" > metrics/lizard-swift.csv
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "captured_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "lizard_version=$(lizard --version 2>&1 | head -n 1)"
            echo "swift_version=$(swift --version | head -n 1)"
            echo "source_file_count=${#swift_files[@]}"
            echo "source_scope=production Swift files"
            echo "excluded=unit tests, UI tests, Pods, DerivedData, .build"
          } > metrics/metadata.txt

      - name: Preserve raw results
        uses: actions/upload-artifact@v4
        with:
          name: ios-static-metrics-${{ github.sha }}
          path: metrics/
          if-no-files-found: error
          retention-days: 90
